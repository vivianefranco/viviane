<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Fundo com gradiente -->
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a5acd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a4fff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Padrão de pontos -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="rgba(255,255,255,0.3)" />
    </pattern>
    
    <!-- Padrão de linhas -->
    <pattern id="lines" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="100" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <line x1="100" y1="0" x2="0" y2="100" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    </pattern>
  </defs>
  
  <!-- Retângulo de fundo com gradiente -->
  <rect width="100%" height="100%" fill="url(#headerGradient)" />
  
  <!-- Camada de padrões -->
  <rect width="100%" height="100%" fill="url(#dots)" />
  <rect width="100%" height="100%" fill="url(#lines)" />
  
  <!-- Formas geométricas decorativas -->
  <circle cx="100" cy="100" r="50" fill="rgba(255,255,255,0.1)" />
  <circle cx="700" cy="500" r="80" fill="rgba(255,255,255,0.05)" />
  <rect x="300" y="200" width="100" height="100" transform="rotate(45 350 250)" fill="rgba(255,255,255,0.08)" />
</svg>
